# Publishes a signed APK as a GitHub Release for a version vX.Y.Z on main (ADR-0029, ADR-0030). Started either by
# the "Run workflow" button on main (it creates the tag after a successful build) or by pushing a tag v*.
# One-time setup and how to cut a release: docs/releasing.md. Job layout: .claude/rules/ci-build.md.
name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1. CHANGELOG.md on main needs a section ## [0.1.1]."
        required: true
        type: string

# One release at a time, never cancelled half-way; a second one waits.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing secrets live in this environment, which only admits main and v* tags (docs/releasing.md).
    environment: release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history and all tags, for the checks below
          persist-credentials: false

      # The tag this run releases: the pushed tag, or v<version> from the button.
      - name: Resolve tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error title=Not on main::Run the release from main, not $GITHUB_REF_NAME (ADR-0020)."
              exit 1
            fi
            tag="v${VERSION#v}"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error title=Tag exists::$tag already exists. Release a new version instead; never move a tag (docs/releasing.md)."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "Releasing $tag from $GITHUB_SHA"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag not on main::$TAG points to a commit that isn't on main. Releases are tags on main (ADR-0020); see docs/releasing.md."
            exit 1
          fi

      # Fail before building: a release must never be unsigned or debug-signed.
      - name: Signing secrets are set
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Signing secrets missing::Missing secrets in the release environment: ${missing[*]}. Nothing is published without the release key; see docs/releasing.md."
            exit 1
          fi

      # Same setup as ci.yml; bump both together.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # Reads the cache main's CI wrote; a release never writes it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Checks the tag format and that CHANGELOG.md has its section, before the long build.
      - name: Release notes from CHANGELOG.md
        run: ./gradlew :app:releaseNotes -Papp.versionTag="$TAG"

      - name: Verify
        run: ./gradlew verify

      # The key only exists in this step, in the runner's temp directory. Signing refuses the configuration cache,
      # so the passwords are never stored in it.
      - name: Assemble signed release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          unset RELEASE_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease -Papp.versionTag="$TAG" --no-configuration-cache

      - name: Check signature and version
        run: |
          version="${TAG#v}"
          # Recomputed here on purpose, as an independent check of the build (ADR-0029).
          IFS=. read -r major minor patch <<<"$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          # AGP names an unsigned release APK app-release-unsigned.apk.
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=No signed APK::$apk is missing; the release build wasn't signed."
            exit 1
          fi
          # Newest stable build-tools (no -rc/preview directories).
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if ! certs="$("$build_tools/apksigner" verify --print-certs "$apk")"; then
            echo "::error title=Bad signature::apksigner rejected $apk."
            exit 1
          fi
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error title=Debug-signed APK::$apk is signed with the debug key."
            exit 1
          fi
          # The certificate is public (it's in every APK): compare its digest with the backup's (docs/releasing.md).
          grep -E "Signer #1 certificate (DN|SHA-256 digest)" <<<"$certs" || true
          # Captured first: piping into grep -m 1 or head would fail aapt2 on the closed pipe under pipefail.
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          package="$(grep -m 1 "^package:" <<<"$badging" || true)"
          echo "$package"
          if ! grep -qF "versionCode='$code' versionName='$version'" <<<"$package"; then
            echo "::error title=Wrong version::Expected versionCode $code and versionName $version for $TAG."
            exit 1
          fi
          mkdir -p out/apk
          cp "$apk" "out/apk/before-you-buy-$version.apk"
          (cd out/apk && sha256sum "before-you-buy-$version.apk" > "before-you-buy-$version.apk.sha256")
          cat out/apk/*.sha256
          cp app/build/release/notes.md out/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Only this job can write to the repository, and it runs no build code.
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      # A release for the tag may already exist: created on GitHub's web page (which also pushes the tag), or by an
      # earlier attempt of this run. Then the files are attached to it and its notes replaced, instead of failing.
      # Otherwise the release is created; on a button run that also creates the tag, at the commit that was built.
      # (A tag created with this token doesn't start another run.)
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice title=Release already existed::Attaching the APK to $TAG and replacing its notes with the CHANGELOG.md section."
            gh release upload "$TAG" out/apk/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file out/notes.md
          else
            gh release create "$TAG" out/apk/* --title "$TAG" --notes-file out/notes.md --target "$GITHUB_SHA"
          fi

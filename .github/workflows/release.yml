# Publishes a signed APK as a GitHub Release for every version tag vX.Y.Z on main (ADR-0029).
# One-time setup and how to cut a release: docs/releasing.md. Job layout: .claude/rules/ci-build.md.
name: Release

on:
  push:
    tags: ["v*"]

# Never cancel a release half-way; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a failing command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The signing secrets live in this environment, which only admits v* tags (docs/releasing.md).
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history, for the tag-on-main check
          persist-credentials: false

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag not on main::$GITHUB_REF_NAME points to a commit that isn't on main. Releases are tags on main (ADR-0020); see docs/releasing.md."
            exit 1
          fi

      # Fail before building: a release must never be unsigned or debug-signed.
      - name: Signing secrets are set
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Signing secrets missing::Missing secrets in the release environment: ${missing[*]}. Nothing is published without the release key; see docs/releasing.md."
            exit 1
          fi

      # Same setup as ci.yml; bump both together.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # Reads the cache main's CI wrote; a release never writes it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Checks the tag format and that CHANGELOG.md has its section, before the long build.
      - name: Release notes from CHANGELOG.md
        run: ./gradlew :app:releaseNotes -Papp.versionTag="$GITHUB_REF_NAME"

      - name: Verify
        run: ./gradlew verify

      # The key only exists in this step, in the runner's temp directory. Signing refuses the configuration cache,
      # so the passwords are never stored in it.
      - name: Assemble signed release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          unset RELEASE_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease -Papp.versionTag="$GITHUB_REF_NAME" --no-configuration-cache

      - name: Check signature and version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Recomputed here on purpose, as an independent check of the build (ADR-0029).
          IFS=. read -r major minor patch <<<"$version"
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          # AGP names an unsigned release APK app-release-unsigned.apk.
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error title=No signed APK::$apk is missing; the release build wasn't signed."
            exit 1
          fi
          # Newest stable build-tools (no -rc/preview directories).
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if ! certs="$("$build_tools/apksigner" verify --print-certs "$apk")"; then
            echo "::error title=Bad signature::apksigner rejected $apk."
            exit 1
          fi
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error title=Debug-signed APK::$apk is signed with the debug key."
            exit 1
          fi
          # The certificate is public (it's in every APK): compare its digest with the backup's (docs/releasing.md).
          grep -E "Signer #1 certificate (DN|SHA-256 digest)" <<<"$certs" || true
          # Captured first: piping into grep -m 1 or head would fail aapt2 on the closed pipe under pipefail.
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          package="$(grep -m 1 "^package:" <<<"$badging" || true)"
          echo "$package"
          if ! grep -qF "versionCode='$code' versionName='$version'" <<<"$package"; then
            echo "::error title=Wrong version::Expected versionCode $code and versionName $version for $GITHUB_REF_NAME."
            exit 1
          fi
          mkdir -p out/apk
          cp "$apk" "out/apk/before-you-buy-$version.apk"
          (cd out/apk && sha256sum "before-you-buy-$version.apk" > "before-you-buy-$version.apk.sha256")
          cat out/apk/*.sha256
          cp app/build/release/notes.md out/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Only this job can write to the repository, and it runs no build code.
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out

      # A release for the tag may already exist: created on GitHub's web page (which also pushes the tag), or by an
      # earlier attempt of this run. Then the files are attached to it and its notes replaced, instead of failing.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::notice title=Release already existed::Attaching the APK to $GITHUB_REF_NAME and replacing its notes with the CHANGELOG.md section."
            gh release upload "$GITHUB_REF_NAME" out/apk/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file out/notes.md
          else
            gh release create "$GITHUB_REF_NAME" out/apk/* --title "$GITHUB_REF_NAME" --notes-file out/notes.md --verify-tag
          fi

# Runs the same gate as a local push (./gradlew verify, docs/architecture.md) plus an unsigned
# release build so R8 runs. Job layout and diagnosis: .claude/rules/ci-build.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Docs-only change?
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Docs-only (docs/**, *.md) skips the Android job; anything else, workflows included, runs it.
          # Without a usable base (new branch, force push) it runs.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; running the Android job."
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          printf 'Changed files:\n%s\n' "$changed"
          if grep -qvE '^docs/|\.md$' <<<"$changed"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change; skipping the Android job."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Verify and build release
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # cmdline-tools and licences; AGP downloads the compileSdk platform and build-tools it needs.
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      # Caches Gradle and validates the wrapper. Only main writes the cache; PRs read it.
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./gradlew verify

      - name: Assemble release (unsigned, runs R8)
        run: ./gradlew assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_attempt }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/outputs/roborazzi/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14

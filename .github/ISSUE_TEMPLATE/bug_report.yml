name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, device and Android version
      placeholder: "0.1.0 · Pixel 8 · Android 16"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria for the fix
      description: Testable. Usually "the steps above now produce the expected result" plus a regression test.
      value: |
        - [ ]

name: Feature request
description: Propose new or changed behaviour
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should be possible that isn't today? Describe the problem, not a chosen solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the app do? Include empty-state, error and first-use cases if they matter.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable, not subjective. The PR is checked against these.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything deliberately excluded, so the PR doesn't sprawl.
  - type: input
    id: decisions
    attributes:
      label: Related ADRs / docs
      description: e.g. ADR-0005, docs/product-brief.md §4.2
